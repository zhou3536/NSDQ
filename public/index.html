<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>美股定投回测</title>
  <link href="a.css" rel="stylesheet">
</head>

<body>
  <div class="shell">
    <div class="topbar">
      <div class="SearchArea">
        <h1>选择定投目标</h1>
        <input type="text" id="csh" class="term-input" placeholder = '搜索美股代码'>
      </div>
      <div class="status" id="statusEl">
        <span class="dot"></span>
        <span id="statusText">未选择目标</span>
      </div>
    </div>

    <div id="CodeListBox"></div>

    <div class="panel">
      <div class="field">
        <label>起始定投日期</label>
        <button type="button" class="term-input" id="datePickerBtn">—</button>
        <div class="picker-panel hidden" id="pickerPanel">
          <div class="picker-breadcrumb" id="pickerBreadcrumb"></div>
          <div class="picker-grid" id="pickerGrid"></div>
        </div>
      </div>

      <div class="field">
        <label>每日定投金额</label>
        <input type="number" class="term-input" id="amountInput" value="10" min="0" step="100">
        <span class="btn" id="okBtn">计算</span>
      </div>
    </div>

    <div class="chart-panel" id="chart-panel">
      <div class="summary" id="summaryEl">
        <div class="stat">
          <div class="k" id="labelInvested">累计投入</div>
          <div class="v neutral" id="statInvested">—</div>
        </div>
        <div class="stat">
          <div class="k" id="labelValue">当前市值</div>
          <div class="v neutral" id="statValue">—</div>
        </div>
        <div class="stat">
          <div class="k" id="labelReturnAbs">浮盈</div>
          <div class="v neutral" id="statReturnAbs">—</div>
        </div>
        <div class="stat">
          <div class="k" id="labelReturn">总收益率</div>
          <div class="v neutral" id="statReturn">—</div>
        </div>
        <div class="stat">
          <div class="k" id="labelCount">定投次数</div>
          <div class="v neutral" id="statCount">—</div>
        </div>
      </div>

      <div class="chart-panel-head">
        <span class="btn" id="swBtn">切换</span>
        <span class="btn" id="fsBtn">全屏</span>
        <h2 id="chartTitle"></h2>
      </div>
      <div id="chart"></div>
      <div id="emptyState" class="empty-state">请先选择定投目标</div>
    </div>
  </div>

  <script src="st/echarts.min.js"></script>
  <script src="scipt.js"></script>
</body>

</html>
