<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>美股定投回测</title>
  <link href="sty.css" rel="stylesheet">
</head>

<body>
  <div class="shell">
    <div class="topbar">
      <a href="/">
        <h1>NASDAQ</h1>
      </a>
      <div class="status" id="statusEl">
        <span class="dot"></span>
        <span id="statusText">未选择目标</span>
      </div>
    </div>
    <div class="SearchArea">
      <div class="sh-input">
        <input type="text" id="csh" placeholder='美股代码'>
        <span id="shBtn">搜索</span>
      </div>

      <div id="CodeListBox">
      </div>
    </div>



    <div class="chart-panel" id="chart-panel">
      <div class="panel">
        <div class="field">
          <label>起始定投日期</label>
          <button type="button" class="term-input" id="datePickerBtn">选择日期</button>
          <div class="picker-panel hidden" id="pickerPanel">
            <div class="picker-breadcrumb" id="pickerBreadcrumb"></div>
            <div class="picker-grid" id="pickerGrid"></div>
          </div>
        </div>

        <div class="field">
          <label>定投周期</label>
          <select class="term-input" id="freqSelect">
            <option value="daily">每日 (交易日)</option>
            <option value="weekly" selected>每周 (周首日)</option>
            <option value="monthly">每月 (月首日)</option>
          </select>
        </div>

        <div class="field">
          <label id="amountLabel">每期定投金额</label>
          <input type="number" class="term-input" id="amountInput" value="10" min="1" max="100">
        </div>

        <div class="field">
          <label>年化分红(%)</label>
          <div class="input-with-btn">
            <input type="number" class="term-input" id="dividendInput" value="0" min="0" max="100" step="0.1"
              placeholder="默认0">
            <span class="btn" id="okBtn">计算</span>
          </div>
        </div>
      </div>
      <div class="summary" id="summaryEl">
        <div class="stat">
          <div class="k">起始价格</div>
          <div class="v neutral">未选择标的</div>
        </div>
      </div>

      <div class="chart-panel-head" id="chart-panel-head">
        <span class="btn" id="swBtn">切换</span>
        <span class="btn" id="fsBtn">横屏</span>
        <h2 id="chartTitle"></h2>
      </div>
      <div id="chart"></div>
      <div id="emptyState" class="empty-state">请先选择定投标的</div>
    </div>
  </div>
  <script src="st/echarts.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
